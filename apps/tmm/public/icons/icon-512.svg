<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="tfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#tfGrad)" />
  
  <!-- Architectural Terrace Lines -->
  <g transform="translate(64, 64)">
    <!-- Building / Terrace silhouette -->
    <path d="M 64,320 L 64,220 L 160,220 L 160,140 L 256,140 L 256,64 L 320,64 L 320,320 Z" fill="none" stroke="#60a5fa" stroke-width="14" stroke-linejoin="round" stroke-linecap="round" opacity="0.4" />
    <path d="M 96,320 L 96,250 L 180,250 L 180,180 L 270,180 L 270,110 L 320,110 L 320,320 Z" fill="none" stroke="#93c5fd" stroke-width="12" stroke-linejoin="round" stroke-linecap="round" opacity="0.6" />
    
    <!-- Stylized "TF" Monogram -->
    <text x="192" y="240" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="140" fill="#ffffff" text-anchor="middle" letter-spacing="-6">TF</text>
    
    <!-- Gold Accent Star / Crown -->
    <polygon points="192,50 204,78 234,78 210,96 219,124 192,106 165,124 174,96 150,78 180,78" fill="url(#goldGrad)" />
    
    <!-- Subtitle Text -->
    <text x="192" y="320" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="28" fill="#94a3b8" text-anchor="middle" letter-spacing="4">TERRACEFERİ</text>
  </g>
</svg>
