# ==============================================================================
# TERRACEFERI - NGINX REVERSE PROXY CONFIGURATION
# Domain: terraceferi.codapi.site
# Sunucu: Ubuntu 24.04 LTS / VDS
# ==============================================================================

upstream terraceferi_upstream {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name terraceferi.codapi.site 104.233.4.15;

    client_max_body_size 50M;
    client_body_buffer_size 128k;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    location /_next/static/ {
        proxy_pass http://terraceferi_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(manifest\.json|sw\.js|favicon\.ico|png|jpg|jpeg|svg|webp|woff|woff2)$ {
        proxy_pass http://terraceferi_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 7d;
        access_log off;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        proxy_pass http://terraceferi_upstream;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}
