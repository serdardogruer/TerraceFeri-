services:
  terraceferi-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: terraceferi-web
    restart: unless-stopped
    network_mode: "host"
    env_file:
      - .env
    environment:
      PORT: 3010
      NODE_ENV: production
    volumes:
      - ./apps/tmm/data:/app/data
      - ./apps/tmm/günlükrapor:/app/günlükrapor
