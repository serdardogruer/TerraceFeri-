# ==============================================================================
# TERRACEFERI - NGINX REVERSE PROXY CONFIGURATION
# Domain: terraceferi.codapi.site
# Sunucu: Ubuntu 24.04 LTS / VDS
# ==============================================================================
# Kurulum Yolu: /etc/nginx/sites-available/terraceferi.codapi.site
# Aktif Etme:   sudo ln -s /etc/nginx/sites-available/terraceferi.codapi.site /etc/nginx/sites-enabled/
# Test:         sudo nginx -t
# Yeniden Yükle: sudo systemctl reload nginx
# ==============================================================================

# Upstream Next.js Node Sunucusu
upstream terraceferi_upstream {
    server 127.0.0.1:3000;
    keepalive 64;
}

# HTTP -> HTTPS Yönlendirme (Cloudflare / Let's Encrypt Uyumlu)
server {
    listen 80;
    listen [::]:80;
    server_name terraceferi.codapi.site;

    # Let's Encrypt Doğrulama Dizin İzni
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Tüm HTTP trafiğini HTTPS'e yönlendir
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Canlı Sunucu Bloğu
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name terraceferi.codapi.site;

    # SSL Sertifika Yolları (Certbot otomatik doldurabilir veya Cloudflare Origin CA)
    # sudo certbot --nginx -d terraceferi.codapi.site
    ssl_certificate /etc/letsencrypt/live/terraceferi.codapi.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/terraceferi.codapi.site/privkey.pem;

    # Modern SSL Protokol ve Şifrelemeleri
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Güvenlik Başlıkları
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Fotoğraf ve Sayaç Görselleri için Yükleme Boyutu Limiti (50 Megabyte)
    client_max_body_size 50M;
    client_body_buffer_size 128k;

    # Gzip Sıkıştırma (Performans & Hızlı Yükleme)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Next.js Statik Dosyaları Uzun Ömürlü Önbellekleme
    location /_next/static/ {
        proxy_pass http://terraceferi_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Public İkon ve Manifest Dosyaları
    location ~* \.(manifest\.json|sw\.js|favicon\.ico|png|jpg|jpeg|svg|webp|woff|woff2)$ {
        proxy_pass http://terraceferi_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 7d;
        access_log off;
        add_header Cache-Control "public, max-age=604800";
    }

    # Ana Uygulama & API Proxying (WebSocket Destekli)
    location / {
        proxy_pass http://terraceferi_upstream;
        proxy_http_version 1.1;

        # WebSocket Upgrade Başlıkları
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Standart Proxy Başlıkları
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Zaman Aşımı Değerleri (Ağır Rapor / AI İşlemleri İçin)
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Tamponlama (Buffering)
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}

# WebSocket connection_upgrade haritası (Nginx ana http bloğunda yoksa bu bloğu http{} altına taşıyın)
